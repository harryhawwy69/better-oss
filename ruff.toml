# Python 3.9 is the oldest supported version; ruff checks syntax against it.
target-version = "py39"
extend-exclude = ["cli/defaults", "cli/node_modules"]

[lint]
# Ruff's defaults (E4, E7, E9, F) plus FA: flag PEP 604 / 585 annotations that
# need `from __future__ import annotations` on the oldest supported Python.
select = ["E4", "E7", "E9", "F", "FA"]
